# CloudNativePG creates the secret "toni-db-app" (username/password) and the service "toni-db-rw".
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: toni-db
  labels:
    {{- include "toni.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: {{ .Values.database.instances }}
  bootstrap:
    initdb:
      database: toni
      owner: toni
  storage:
    size: {{ .Values.database.storage }}
    {{- with .Values.database.storageClass }}
    storageClass: {{ . }}
    {{- end }}
