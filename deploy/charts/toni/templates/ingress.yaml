apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: toni
  labels:
    {{- include "toni.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.domain | quote }}]
      secretName: toni-tls
  rules:
    - host: {{ .Values.domain | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: toni-api, port: { name: http } } }
          - path: /hubs
            pathType: Prefix
            backend: { service: { name: toni-api, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: toni-web, port: { name: http } } }
