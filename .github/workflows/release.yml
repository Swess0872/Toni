# Push to main → test → build images → push to GHCR → bump the image tag in
# deploy/toni/kustomization.yaml. Argo CD sees the commit and rolls it out.
name: Release

on:
  push:
    branches: [main]
    paths:
      - api/**
      - app/**
      - .github/workflows/release.yml
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  images:
    name: Images bauen
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      registry: ${{ steps.vars.outputs.registry }}
    steps:
      - uses: actions/checkout@v7
      - id: vars
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API-Image
        uses: docker/build-push-action@v7
        with:
          context: api
          push: true
          tags: |
            ${{ steps.vars.outputs.registry }}/toni-api:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.registry }}/toni-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Web-App bauen
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release
      - name: Web-Image
        uses: docker/build-push-action@v7
        with:
          context: app
          push: true
          tags: |
            ${{ steps.vars.outputs.registry }}/toni-web:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.registry }}/toni-web:latest

  deploy:
    name: Deployment auslösen (GitOps)
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Neue Image-Version in kustomization.yaml eintragen
        env:
          TAG: ${{ needs.images.outputs.tag }}
          REGISTRY: ${{ needs.images.outputs.registry }}
        # Always starts from the newest main and re-applies the values, so a push
        # that lands meanwhile can never cause a merge conflict.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            yq -i '.images[] |= (.newTag = strenv(TAG) | .newName = strenv(REGISTRY) + "/" + .name)' deploy/toni/kustomization.yaml
            git diff --quiet && { echo "Schon aktuell"; exit 0; }
            git commit -qam "deploy: toni $TAG"
            git push -q origin HEAD:main && { echo "Deployt: $TAG"; exit 0; }
            echo "Push fehlgeschlagen (Versuch $attempt), neuer Anlauf …"
            sleep 5
          done
          exit 1
