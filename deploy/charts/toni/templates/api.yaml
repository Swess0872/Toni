apiVersion: apps/v1
kind: Deployment
metadata:
  name: toni-api
  labels:
    {{- include "toni.labels" . | nindent 4 }}
    app.kubernetes.io/name: toni-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: toni-api
  template:
    metadata:
      labels:
        {{- include "toni.labels" . | nindent 8 }}
        app.kubernetes.io/name: toni-api
    spec:
      {{- include "toni.pullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/toni-api:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: toni-db-app, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: toni-db-app, key: password } }
            - name: ConnectionStrings__Default
              value: "Host=toni-db-rw;Database=toni;Username=$(DB_USER);Password=$(DB_PASSWORD)"
            - name: Toni__JwtKey
              valueFrom: { secretKeyRef: { name: {{ .Values.api.secretName }}, key: jwtKey } }
            - name: Toni__AdminUsername
              valueFrom: { secretKeyRef: { name: {{ .Values.api.secretName }}, key: adminUsername, optional: true } }
            - name: Toni__AdminPassword
              valueFrom: { secretKeyRef: { name: {{ .Values.api.secretName }}, key: adminPassword, optional: true } }
            - name: Toni__DemoMode
              value: {{ .Values.api.demoMode | quote }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: toni-api
  labels:
    {{- include "toni.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: toni-api
  ports:
    - name: http
      port: 80
      targetPort: http
