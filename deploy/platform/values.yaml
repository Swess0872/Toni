# repoURL and acmeEmail are passed in by the root Application (bootstrap/install.sh).
repoURL: ""
targetRevision: main
acmeEmail: ""
# Set by install.sh when GITHUB_TOKEN is given (private GHCR packages).
imagePullSecret: ""

# Each component can be switched off if the cluster already has it;
# install.sh detects existing installations and sets these for you.
argocd:
  # Let Argo CD upgrade itself from deploy/argocd. Off when Argo CD was installed separately.
  selfManaged: true

traefik:
  # Set to false if the cluster already ships an ingress controller (k3s has Traefik built in).
  enabled: true
  chartVersion: 42.1.3
  # true: bind ports 80/443 directly on the nodes (self-hosted, no LoadBalancer).
  # false: classic Service type LoadBalancer (cloud, MetalLB).
  hostPorts: true

certManager:
  enabled: true
  chartVersion: v1.21.3

cnpg:
  enabled: true
  chartVersion: 0.29.1

toni:
  namespace: toni
