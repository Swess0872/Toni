name: CI

on:
  pull_request:
  workflow_call:

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  api:
    name: API testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test api/Toni.slnx

  app:
    name: App analysieren & testen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  deploy:
    name: Kubernetes-YAML prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: kubectl kustomize deploy/toni > /dev/null
