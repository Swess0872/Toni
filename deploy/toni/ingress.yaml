# Erreichbar über http://toni.techstein.ch (Port 80 des Clusters).
# HTTPS macht der Reverse Proxy davor und leitet unverschlüsselt hierher weiter.
#   /api und /hubs  → API
#   alles andere    → Web-App
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: toni
  annotations:
    nginx.org/websocket-services: api   # Live-Updates (SignalR) unter /hubs
spec:
  ingressClassName: nginx
  rules:
    - host: toni.techstein.ch
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: api, port: { number: 80 } } }
          - path: /hubs
            pathType: Prefix
            backend: { service: { name: api, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
