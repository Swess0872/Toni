# Local Postgres for `dotnet run` (matches appsettings.Development.json).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: toni
      POSTGRES_USER: toni
      POSTGRES_PASSWORD: toni
    ports:
      - "5432:5432"
    volumes:
      - toni-db:/var/lib/postgresql/data
volumes:
  toni-db:
