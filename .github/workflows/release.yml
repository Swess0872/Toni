# Push to main → test → build images → push to GHCR → bump the image tag in
# deploy/charts/toni/values.yaml. Argo CD sees the commit and rolls it out.
name: Release

on:
  push:
    branches: [main]
    paths:
      - api/**
      - app/**
      - .github/workflows/release.yml
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  images:
    name: Images bauen
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      registry: ${{ steps.vars.outputs.registry }}
    steps:
      - uses: actions/checkout@v7
      - id: vars
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API-Image
        uses: docker/build-push-action@v7
        with:
          context: api
          push: true
          tags: |
            ${{ steps.vars.outputs.registry }}/toni-api:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.registry }}/toni-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Web-App bauen
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release
      - name: Web-Image
        uses: docker/build-push-action@v7
        with:
          context: app
          push: true
          tags: |
            ${{ steps.vars.outputs.registry }}/toni-web:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.registry }}/toni-web:latest

  deploy:
    name: Deployment auslösen (GitOps)
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Image-Tag in values.yaml setzen
        env:
          TAG: ${{ needs.images.outputs.tag }}
          REGISTRY: ${{ needs.images.outputs.registry }}
        run: |
          yq -i '.image.tag = strenv(TAG) | .image.registry = strenv(REGISTRY)' deploy/charts/toni/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: toni $TAG" || exit 0
          git pull --rebase
          git push
