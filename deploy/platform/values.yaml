# repoURL and acmeEmail are passed in by the root Application (bootstrap/install.sh).
repoURL: ""
targetRevision: main
acmeEmail: ""
# Set by install.sh when GITHUB_TOKEN is given (private GHCR packages).
imagePullSecret: ""

argocd:
  selfManaged: true

traefik:
  # Set to false if the cluster already ships an ingress controller (k3s has Traefik built in).
  enabled: true
  chartVersion: 42.1.3
  # true: bind ports 80/443 directly on the nodes (self-hosted, no LoadBalancer).
  # false: classic Service type LoadBalancer (cloud, MetalLB).
  hostPorts: true

certManager:
  chartVersion: v1.21.3

cnpg:
  chartVersion: 0.29.1

toni:
  namespace: toni
