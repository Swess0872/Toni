apiVersion: apps/v1
kind: Deployment
metadata:
  name: toni-web
  labels:
    {{- include "toni.labels" . | nindent 4 }}
    app.kubernetes.io/name: toni-web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: toni-web
  template:
    metadata:
      labels:
        {{- include "toni.labels" . | nindent 8 }}
        app.kubernetes.io/name: toni-web
    spec:
      {{- include "toni.pullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: "{{ .Values.image.registry }}/toni-web:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: http }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: toni-web
  labels:
    {{- include "toni.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: toni-web
  ports:
    - name: http
      port: 80
      targetPort: http
