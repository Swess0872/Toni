name: CI

on:
  pull_request:
  workflow_call:

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  api:
    name: API testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test api/Toni.slnx

  app:
    name: App analysieren & testen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  helm:
    name: Helm-Charts prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - run: |
          helm lint deploy/charts/toni
          helm template deploy/charts/toni > /dev/null
          helm lint deploy/platform --set repoURL=https://example.com/repo.git --set acmeEmail=ci@example.com
