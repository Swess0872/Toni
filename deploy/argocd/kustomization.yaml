# Argo CD itself. Applied once by bootstrap/install.sh, afterwards Argo CD manages
# its own upgrades from here: bump the version in the URL and push.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml
