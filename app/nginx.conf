server {
    listen 8080;
    root /usr/share/nginx/html;

    # Flutter's file names carry no version, so every file must be revalidated:
    # otherwise browsers or Cloudflare mix a new main.dart.js with an old icon
    # font (icons go missing) or keep old app icons. Unchanged files cost a 304.
    # This also covers web/service-worker.js, which removes the old Blazor app.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
}
